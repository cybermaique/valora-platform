name: 🏷️ Auto Label PRs

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    # Se suas PRs vierem de fork, troque por pull_request_target (ver nota abaixo)

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Detect and label PR type
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref
            const map = {
              'feature/': 'feature',
              'fix/': 'fix',
              'refactor/': 'refactor',
              'docs/': 'docs',
              'test/': 'test',
              'chore/': 'chore',
            }
            const entry = Object.entries(map).find(([prefix]) => branch.startsWith(prefix))
            if (!entry) {
              console.log(`ℹ️ Nenhum prefixo conhecido para a branch: ${branch}`)
              return
            }
            const label = entry[1]

            // Garante que a label existe; se não existir, cria
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label })
            } catch {
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: 'BBBBBB',
                description: `Auto label for ${label}`,
              })
            }

            // Aplica a label
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            })
            console.log(`✅ Applied label: ${label} (branch: ${branch})`)
