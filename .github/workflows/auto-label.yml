name: 🏷️ Auto Label PRs

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Detect and label PR type
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref
            const map = {
              'feature/': 'feat',
              'fix/': 'fix',
              'refactor/': 'refactor',
              'docs/': 'docs',
              'test/': 'test',
              'chore/': 'chore',
            }
            const entry = Object.entries(map).find(([prefix]) => branch.startsWith(prefix))
            if (!entry) return
            const [prefix, type] = entry

            const label = type === 'feat' ? 'feature' : type
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label })
            } catch {
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: 'BBBBBB',
                description: `Auto label for ${label}`,
              })
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            })

      - name: Normalize PR title from branch
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const branch = pr.head.ref

            const map = {
              'feature/': 'feat',
              'fix/': 'fix',
              'refactor/': 'refactor',
              'docs/': 'docs',
              'test/': 'test',
              'chore/': 'chore',
            }
            const entry = Object.entries(map).find(([p]) => branch.startsWith(p))
            if (!entry) return
            const [prefix, type] = entry

            const rest = branch.slice(prefix.length)
            const [scope, ...words] = rest.split('/')
            const summaryKebab = (words.length ? words.join('/') : scope).replace(/_/g, '-')
            const summary = summaryKebab.replace(/[-_/]+/g, ' ').trim()

            const current = pr.title.trim()
            const conventional = new RegExp('^(feat|fix|refactor|docs|test|chore)\\(.+\\):\\s+.+')
            if (conventional.test(current)) return

            const description = summary || current.toLowerCase()
            const scopeNorm = (words.length ? scope : 'general')
            const newTitle = `${type}(${scopeNorm}): ${description}`

            await github.rest.pulls.update({
              ...context.repo,
              pull_number: pr.number,
              title: newTitle,
            })

      - name: Apply PR template based on type
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const path = require('path')

            const branch = context.payload.pull_request.head.ref
            const templatesDir = '.github/PULL_REQUEST_TEMPLATE'
            const mapping = {
              'feature/': 'feature.md',
              'fix/': 'fix.md',
              'refactor/': 'refactor.md',
              'docs/': 'docs.md',
              'test/': 'test.md',
              'chore/': 'chore.md',
            }

            const entry = Object.entries(mapping).find(([prefix]) => branch.startsWith(prefix))
            if (!entry) return
            const [prefix, templateFile] = entry

            const filePath = path.join(process.env.GITHUB_WORKSPACE, templatesDir, templateFile)
            if (!fs.existsSync(filePath)) return

            const content = fs.readFileSync(filePath, 'utf8')

            await github.rest.pulls.update({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              body: content,
            })
