name: Auto Label PRs
on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: |
            ${{ startsWith(github.head_ref, 'feature/') && 'feature' }}
            ${{ startsWith(github.head_ref, 'fix/') && 'fix' }}
            ${{ startsWith(github.head_ref, 'refactor/') && 'refactor' }}
            ${{ startsWith(github.head_ref, 'docs/') && 'docs' }}
            ${{ startsWith(github.head_ref, 'test/') && 'test' }}
            ${{ startsWith(github.head_ref, 'chore/') && 'chore' }}

